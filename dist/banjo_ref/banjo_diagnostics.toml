# banjo_diagnostics.toml: generated by tools/make_enhancement_configs.py from renut.toml; changed keys: switch_profile_stacks = true, masseffect_gpu_marks_categories = true, banjo_cpu_profiler = true, banjo_diag_gpu_groups = 2, masseffect_native_stats_per_draw_s = 10, vulkan_pipeline_executable_info = true, banjo_diag_shader_stats = "all", banjo_diag_shader_asm = "538,449,37,201,557,767,167,159,252,401,292,112,116,658,173", banjo_diag_vk_calls = true, banjo_renderer = "native", disable_msaa = false
# banjo-nx test config (Switch). Lines are cvars.

# Renderer: the native Vulkan renderer (needs banjo_shaders.mesp and banjo_shaders.mesp.idx next to the NRO).
# Set masseffect_renderer_native = false to fall back to ReXGlue's emulated Xbox 360 GPU (slow, reference image).
gpu_plugin = "xenos"
masseffect_renderer_native = true
gpu_allow_invalid_fetch_constants = true
readback_memexport = false
readback_memexport_fast = false

# MSAA as the game sets it (2x). true = no MSAA (both work on PC).
# Package 28b (your choice, 2026-10-17): the game's 2x MSAA off for Renut's renderer (one sample per pixel: aliased
# edges, less GPU bandwidth); configs/banjo_renut_msaa.toml puts it back. banjo-nx's renderer collapses MSAA itself and
# its configs keep this false.
disable_msaa = false

# Shaders the renderer cannot identify are written here once (raw microcode). Please send this folder back:
# they get added to banjo_shaders.mesp (new areas of the game may have shaders the PC runs have not seen yet).
banjo_shader_misses = "sdmc:/switch/banjo-nx/shader_misses"

# Logs go to logs/rex/ next to the NRO. Please send them back after a test.
log_level = "info"
# The file log is written by a thread of its own (from futari-nx): the ring thread never waits for the SD card.
log_file_writer = true

# Profiler (ported from UnleashedRecomp-NX): on-screen window, per-thread CPU report, stall watchdog.
banjo_show_profiler = true
banjo_stall_watch_seconds = 1
# Profiling (on in every config except configs/banjo_cpu_verify.toml):
# CPU: the SDK's sampler records every thread's code addresses into logs/rex/rex_profile.log.
switch_profile_stacks = true
# The app's own sampler (logs/rex/banjo_profiler.log); configs/banjo_profile.toml turns it on as well.
banjo_cpu_profiler = true

# Performance enhancements (docs/enhancements.md). Each one is active only when its own key AND its group's master
# switch are on; the log has one "[enhancements]" line saying what ran. Set a master to false for an A/B test.
banjo_cpu_enhancements = true
banjo_noncpu_enhancements = true
# CPU: the game's wait for GPU ring space sleeps instead of spinning (3 threads spun at ~55 % each).
banjo_wait_blocking_ring = true
# Non-CPU: Mesa's own SD-card shader cache off (the renderer's cache/ file keeps the pipelines).
banjo_mesa_disk_cache_off = true
# Non-CPU: compile the pipelines listed in cache/masseffect_native_pipelines.bin in the background from boot.
masseffect_native_pipelines_prewarm = true
banjo_prewarm_threads = 1
# Non-CPU: per-stage shader cache in the GPU driver (a shader shared by several pipelines is compiled once).
masseffect_nvk_cache_per_stage = true
# CPU: the Draw* record pairing never paired a draw in Banjo (Mass Effect's device offsets): skipped. Same shaders.
banjo_no_draw_pairing = true
# CPU: a draw with the same render-target state as the draw before reuses its EDRAM preparation (sa2-nx). Same image.
banjo_ring_edram_memo = true
# CPU: shader constants with the same bytes as the block uploaded last keep it bound (sa2-nx). Same bytes.
banjo_ring_constants_dedupe = true
# CPU: shader-object bookkeeping in one shared table (no thread-local lookups on ARM); render-target lookups from a memo;
# the ring's frame-pacing wait sleeps until a vblank or submission instead of waking every 50 us (all from sa2-nx or
# measured here; same results).
banjo_note_shader_fast = true
banjo_ring_target_memo = true
banjo_ring_wait_vblank = true
# CPU: a draw's vertex window inside a larger copy of the same buffer already uploaded this frame reuses it (from the
# Sonic Transformed port; 55-60 % fewer vertex bytes copied on PC; same bytes, self-checked).
banjo_ring_vertex_containment = true
# CPU: vertex data that does not change keeps its converted copy in a buffer that lasts across frames; each use reads
# the game's bytes once (a fingerprint of all of them) instead of copying them into the frame's upload buffer. All
# vertex data of the main menu and of gameplay is of that kind. Self-checked: the first 4096 uses and one in 4096
# after are compared byte by byte ("persistent vertices" line in the log, every 10 s). _mb is the buffer's size.
banjo_ring_vertex_persistent = true
banjo_ring_vertex_persistent_mb = 64
# Part of it: a buffer read once stays good for the draws the game had already sent when it was read.
banjo_ring_vertex_persistent_submitted = true
# CPU: the index cache matches index ranges by address within a synchronization epoch (no hash of every draw's indices).
banjo_ring_index_epoch = true
# CPU: the direct renderer's step 1 (draw state as host records instead of PM4). Identical image, but not faster on
# PC; configs/banjo_direct_ab.toml measures it on the console. Off until then.
banjo_direct_state = false

# CPU: the native renderer's ring-thread fast paths (from masseffect-nx's measured best profile). Each one checks itself
# against the regular path for its first masseffect_native_verify_n uses and logs a DIFFERENCE line (and falls back) if
# they ever disagree. Checked on PC with Banjo: no differences, same image.
masseffect_native_flat_identity = true
masseffect_native_fast_pair = true
masseffect_native_raw_microcode = true
masseffect_native_pm4_fast = true
masseffect_native_compare_fast = true
masseffect_native_fast_copy = true
masseffect_native_fast_copy_verify = 256
# 2 = the A57's hardware CRC32 pair instead of XXH3 for the fingerprints (sa2-nx round 6; masseffect_crc_fingerprint.h:
# 2^-64 collision odds, ~4 bytes/cycle against XXH3's ~3; they only decide same-frame reuse).
masseffect_native_fingerprint_mode = 2
# The fingerprint above (mode 2) by a PMULL-folded 64-bit CRC instead of the CRC32 pair (half the work per byte).
banjo_ring_pmull_fingerprint = true
masseffect_native_dedupe_max_fingerprint = 16384
masseffect_native_indices_cache = true
# The upload buffer (every draw's vertices and indices) in CPU-cached memory, published before each submit (sa2-nx round
# 3: the console wrote 5,251 MB/s there against 2,506 in the uncached type). Same bytes.
masseffect_native_upload_memory = 1
masseffect_native_verify_n = 2048
masseffect_notify_no_lock = true
# Deferred command recording (a worker thread records the Vulkan commands the render thread would make itself): ON
# since package 25, its worker on core 0 (the ring split's decoder has core 2). Package 24b's console A/B (target 16):
# the executor's work a draw -12.2 % and 5.0 % more Swaps with the worker on core 0 (-10.3 % / +3.2 % on core 2); before
# the ring split (package 21b) it had been "slightly worse". Same commands, same picture (checked in-run on PC).
# configs/banjo_deferred_ab.toml still switches it every 4 s.
masseffect_native_deferred_recording = true
masseffect_deferred_native_fast = true
masseffect_deferred_native_update = true
banjo_deferred_core = 0
# Measurement-only work off (no change to the image): texture-reuse statistics on the ring thread.
masseffect_native_diag_reuse = false
# GPU profiling: a GPU timestamp at every pass-category change, so the "GPU per Swap" lines give time per category and
# the idle gap (no change to the image).
masseffect_gpu_marks_categories = true

# From the SA2 port (2026-10-07), each with its own key (all on by default; the CPU / non-CPU master switches turn them
# off with the rest). CPU: base-zero vertex binding for shaders that read r0, EDRAM bound-plan memo, estimator reason.
banjo_vertices_base_zero_r0 = true
banjo_ring_bound_plan_memo = true
banjo_ring_estimator_reason = true
# GPU: resolves drawn on the 3D engine, depth + color clears into their 1x owners, push constants once per pass,
# narrower pass-end barriers, handheld GPU profile (460.8 MHz; nothing when docked).
banjo_gpu_resolve_draw = true
banjo_gpu_edram4_clear_color0 = true
banjo_gpu_push_once = true
banjo_gpu_pass_narrow_end = true
banjo_gpu_boost = true
# GPU, need the shader package of this build (banjo_shaders.mesp): blend skip, structured control flow, and per-pipeline
# facts the shaders stop testing per vertex/pixel. (The blend skip here is our native renderer's; Renut's renderer has
# its own key, banjo_renut_blend_skip, off: see below.)
banjo_gpu_blend_skip = true
banjo_gpu_structured_cf = true
banjo_gpu_texcoords_unswapped = true
banjo_gpu_no_texture_signs = true
banjo_gpu_identity_remap = true
banjo_gpu_index_base_held = true
# The alpha test right after the last instruction the alpha needs: a 2x2 quad whose pixels all fail stops there
# (tools/early_alpha.py; needs the shader package of this build).
banjo_gpu_early_alpha = true

# From the SA2 port's CPU rounds (2026-10-13). Most of that work is in the NRO itself (how the game code is built);
# these are its run-time keys, CPU group: compare-and-swap without the trailing barrier, a critical section's owner
# taken from the game's own processor block instead of a thread lookup, no wake-up system call for an event or
# semaphore nobody waits on.
banjo_cpu_guest_cas_no_barrier = true
kernel_critsec_pcr_owner = true
thread_signal_skip_idle = true
# Renderer correctness fix from the SA2 port (non-CPU group): a texture the game allocates a few pages above a freed
# render-target copy gets its own image instead of being drawn into the old one.
banjo_native_partial_resolve_inside = true
# Driver side, from the SA2 port (non-CPU group): ask the graphics driver for its per-draw fast paths (they were never
# requested in earlier builds: the app looked them up under a name this driver does not export). Each path checks
# itself inside the driver and switches itself off on a difference ("C6 NVK per draw" lines in the log).
banjo_gpu_nvk_draw_contract = true
# Long sessions, from the SA2 port (non-CPU group): render-target copies the game stopped using two minutes ago are
# released instead of kept until the game is closed (GPU memory filled up over one to two hours in SA2 and NFSMW:
# shadows glitch, then black textures). Textures the game keeps showing long after drawing them (its cached shadow
# atlas, things drawn once) are kept, up to a budget of 128 MB in all. The log reports the total every 600 frames
# ("resolved textures and ... parked hold N MB").
banjo_native_resolved_retire_idle = true
banjo_native_resolved_idle_frames = 3600
banjo_native_resolved_budget_mb = 128
# Texture correctness (non-CPU group): a sampler takes the filters the shader's own fetch instruction asks for.
banjo_native_tfetch_filters = true

# Removing emulation the game does not rely on (2026-10-13 evening; non-CPU group; docs/enhancements.md).
# The frame's targets were imported from the emulated EDRAM (the console GPU's small render memory) far more often than
# the game reads old contents: full-screen clears and passes are now recognised in three more cases.
banjo_gpu_proof_tess_leftover = true
banjo_gpu_proof_triangle = true
banjo_gpu_edram4_color_consumer = true
banjo_gpu_edram4_alias_by_shape = true
banjo_gpu_edram4_copy_batch = true
# The scene is drawn once instead of once per tile (the Xbox 360 splits the 720p scene in two halves that share its
# render memory, and the game sends every draw twice). Checks itself: every dropped second-pass draw is compared with
# the one made for it ("tiles once" line in the log); a frame it does not recognise is drawn in two passes as before.
banjo_gpu_tiles_once = true
# Texture correctness: level range of a sampler by the console's rule, and array textures whose big level is not
# loaded yet built from the first level present (this was the dark patches on Banjo's fur).
banjo_native_mip_range = true
banjo_native_stacked_baseless = true

# After the second console run (2026-10-13 night; CPU group, the renderer thread; docs/enhancements.md).
# A shader program the game loads again from the same place is recognised by one compare instead of three copies and
# a hash (about a thousand times a frame); small vertex buffers are no longer sampled on every draw; the compare of
# shader constants stops while it never finds an equal block.
banjo_ring_shader_load_memo = true
banjo_ring_vertex_epoch = true
banjo_ring_constants_adaptive = true
# Console trial, OFF here: the graphics driver's early depth rejection in the direction Banjo's scene uses
# (configs/banjo_zcull_greater.toml turns it on; check the picture and the "scene" figure of the "GPU per Swap" line).
banjo_gpu_zcull_greater = false

# Render thread and GPU round of 2026-10-14 (docs/enhancements.md). CPU group, the renderer thread: a draw asks once
# whether its vertex shader is the one loaded; the sampler cache compares in line; vertex buffers already proven
# unchanged are bound before the upload tables are searched.
banjo_ring_identity_once = true
banjo_ring_sampler_fast = true
banjo_ring_vertex_proven_first = true
# Non-CPU group: the particle simulation's point draws no longer pull the render target's memory into place first
# (what they draw there is overwritten by the next draw; checked every time, "dead raster" line in the log); the
# two-rectangle rest of a Clear is drawn one rectangle at a time.
banjo_gpu_dead_raster = true
banjo_gpu_rect_split = true
# Non-CPU group: a depth clear drawn in the depth-only mode counts as a full overwrite even with the alpha test left
# on (no pixel shader runs in that mode). The loading screen's clear moved the whole depth buffer between two
# layouts twice a frame without it ("depth-only mode with alpha bits set" in the "overwrite proof" log line).
banjo_gpu_proof_depth_only = true
# Non-CPU group: a Clear's edge strip (the part of a surface that is not a whole number of EDRAM tiles) takes its
# tiles without bringing the rest of each tile over first; the rest is brought over only if something reads it before
# the tile is overwritten whole ("split tiles" log line). The shadow maps' edge columns were 100 tiles a frame.
banjo_gpu_edram4_split_tiles = true

# Hot game functions as native copies (2026-10-14; CPU group; docs/enhancements.md): eighteen functions of the game run
# as copies that keep their work in the processor; each compares itself with the original and turns itself off if they differ.
banjo_cpu_native_sub_823A9E80 = true
banjo_cpu_native_sub_823A9FF0 = true
banjo_cpu_native_sub_82B0DCB8 = true
banjo_cpu_native_sub_823A74E8 = true
banjo_cpu_native_sub_8222AB88 = true
banjo_cpu_native_sub_8230AE18 = true
banjo_cpu_native_sub_823AB4A8 = true
banjo_cpu_native_sub_823B5FD0 = true
banjo_cpu_native_sub_823A9A58 = true
banjo_cpu_native_sub_8225B750 = true
banjo_cpu_native_sub_823AC218 = true
banjo_cpu_native_sub_8225A680 = true
banjo_cpu_native_sub_823B5EA0 = true
banjo_cpu_native_xaudio_src_m03 = true
banjo_cpu_native_sub_829A5DC0 = true
banjo_cpu_native_sub_82252C10 = true
banjo_cpu_native_sub_823A9D70 = true
banjo_cpu_native_sub_8225B210 = true

# Hand-written natives (2026-10-14; CPU group; docs/enhancements.md): the game's C runtime memcpy and memset and four
# Direct3D writers (the two shader-constant writers and the two writers of the state flush) as native code written by
# hand, in front of the copies of those functions. The first four switch each native off everywhere at once (the
# generated copies then run); the six below are the hooks of the functions themselves.
banjo_hand_memcpy = true
banjo_hand_memset = true
banjo_hand_constants = true
banjo_hand_state_flush = true
banjo_cpu_native_memcpy = true
banjo_cpu_native_memset = true
banjo_cpu_native_constants_vs = true
banjo_cpu_native_constants_ps = true
banjo_cpu_native_flush_constants = true
banjo_cpu_native_flush_registers = true

# Stability (2026-10-14, after the out-of-memory crash 6.5 minutes into a console run): megabytes of the graphics
# memory budget kept free. With less left, textures not used for a few seconds are released as they are when the
# texture cache reaches its limit. 0 = off.
banjo_native_textures_reserve_mb = 192

# Native Direct3D draw path (2026-10-14; CPU group; docs/d3d-native.md): DrawIndexedVertices and DrawVertices with their
# draw-time state flush as native code that writes the same command bytes into Direct3D's command buffer; checked
# against the original on a copy of the device (first calls of each thread, then 1 in 4096).
banjo_d3d_native_draw_indexed = true
banjo_d3d_native_draw_vertices = true

# The API layer's operations (2026-10-14; non-CPU group; docs/d3d-native.md section 9). A marker around Direct3D's Clear
# and Resolve tells the renderer when they cover a whole surface; the surface's partly covered edge tiles (pitch padding)
# are then taken whole instead of being copied in from the EDRAM's previous owner every frame. On the PC with these
# settings, the intro cutscene went from about 87 transfer tiles a frame to 0 (your last log: 23 ms of GPU a frame).
banjo_d3d_api_clear = true
banjo_d3d_api_resolve = true
# Non-CPU group: a draw that writes nothing (no colour, depth, stencil or memory; occlusion queries are answered by the
# renderer itself) is not drawn: about 850 a frame in the intro (from sasrt-nx's port).
banjo_gpu_skip_dead_draws = true
# CPU group, OFF: trusting Direct3D's vertex buffer Locks instead of re-reading vertex memory is not exact for this game
# (loading rewrites vertex memory without a Lock). Kept for diagnostics only.
banjo_ring_vertex_lock_rule = false

# Package 26 (2026-10-17). The renderer, chosen at boot: "native" = banjo-nx's renderer (every banjo_* GPU and ring key
# above), "renut" = Renut upstream's Direct3D-level renderer through plume/Vulkan (docs/renut-renderer-port.md). The CPU
# and codegen work runs with either. Since package 28 this file boots Renut's renderer, every one of its optimisations on
# (all its banjo_renut_* and banjo_gpu_* keys default to on; the master switches above are on);
# configs/banjo_renderer_native.toml is this file with "native".
banjo_renderer = "native"
# Package 29 (2026-10-17): Renut's renderer on deko3d (docs/deko3d-renderer.md) instead of Vulkan/NVK. Its compiled
# shaders are in deko3d_shaders.bin next to the NRO; a shader that is not there is compiled on the console (a short
# stall the first time) and added to it. "vulkan" = NVK as up to package 28b (configs/banjo_renut_vulkan.toml).
renut_gpu_backend = "deko3d"
renut_post_process_precision = "Game"
# Package 30 (2026-10-17): the blend skip is off for Renut's renderer (it blurred what the depth of field keeps sharp,
# and hid the river water on deko3d). banjo_gpu_blend_skip above is our native renderer's now; this is Renut's.
# configs/banjo_renut_blendskip_ab.toml turns it on again, switched every 4 s, for a comparison only.
banjo_renut_blend_skip = false
# Diagnostics for Renut's renderer: its GPU time by pass every 10 s ("GPU profile" lines; the console's timer ticks
# are corrected since package 28), and one frame every 30 s of its resolves, clears and target changes ("[trace]").
# The "[renut]" lines every 10 s (frame rate, render thread, GPU, draw kinds, depth words, check worker) are always on;
# switch_profile_stacks above samples every thread's code (logs/rex/rex_profile.log).
renut_gpu_profile = 10.0
banjo_renut_diag_resolve_trace = true
# Package 30 (your request): the GPU profile split by pixel shader and blending as well ("GPU profile" lines: the main
# 1280x720 pass in ms, with draws a frame), to see where deko3d's GPU time goes. Its timestamps cost a little GPU and
# render thread time; false gives the plain profile.
banjo_renut_diag_gpu_shaders = true
# Frame pacing (your "it likes 20 if it cannot hold 30"): the game no longer waits for the display's vblanks itself
# (its present interval rounded every frame to 33 or 50 ms); the frame cap holds 30 and a frame rate between 20 and 30
# shows as it is. configs/banjo_pacing_game.toml puts the game's own pacing back.
target_refreshRate = 0
frame_cap = "30"
banjo_diag_gpu_groups = 2
masseffect_native_stats_per_draw_s = 10
vulkan_pipeline_executable_info = true
banjo_diag_shader_stats = "all"
banjo_diag_shader_asm = "538,449,37,201,557,767,167,159,252,401,292,112,116,658,173"
banjo_diag_vk_calls = true
