# bangaio-nx: function boundaries and names for Bangai-O HD: Missile Fury (default.xex, XDK 2.0.20209).
# Evidence for each entry: docs/bangaio-notes.md, "Code generation". banjo-nx's N&B entries were removed.

# The CRT's setjmp / longjmp (root keys), found by shape as in zumasrevenge-nx / nights-nx:
#   setjmp  0x82425E30: a hook word at 0x82547248 tried first (bnectr), mflr, mfcr, stfd f14-f31 at 0(r3)... (the
#           image's only `stfd f14,0(r3)`, at 0x82425E4C)
#   longjmp 0x824258F0: mr r6,r4; the check of +312, mr r7,r3, lfd f14-f31 from 0(r7)... (the only `lfd f14,0(r7)`)
setjmp_address = 0x82425E30
longjmp_address = 0x824258F0

[functions]
# A callback whose address is built at 0x8224D7EC (lis/addi) and passed at run time: the first Renut boot (renut2)
# stopped on "Call to invalid or unregistered function at guest address 0x8224D630" while loading FONT02.TTF. The
# pointer sweep had rejected it as a fragment (it reads r5, an argument register): a whole leaf of 20 instructions,
# lwz r11,16(r3) ... blr at 0x8224D67C, in the gap after sub_8224D3xx's last block.
"0x8224D630" = { size = 0x50 }
# Named for Renut's renderer (REX_IMPORT __imp__rex_GetCurrentThreadId): the XDK's GetCurrentThreadId,
# `lwz r11,256(r13); lwz r3,332(r11); blr` (Bejeweled 3's sub_825F8690, paired by call alignment).
"0x8243A860" = { name = "rex_GetCurrentThreadId" }

